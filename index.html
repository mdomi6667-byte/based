    <meta name="fc:miniapp" content='{

    <title>Based | Build & Create</title>
    <link rel="icon" href="/logo.png" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            colors: {
              base: {
                blue: '#0052FF',
                dark: '#050505',
                light: '#F5F5F7',
                cardDark: '#1C1C1E',
                cardLight: '#FFFFFF',
              }
            },
            boxShadow: {
              'ios': '0 4px 20px -2px rgba(0, 0, 0, 0.1)',
              'ios-hover': '0 8px 30px -4px rgba(0, 0, 0, 0.15)',
              'glow': '0 0 20px rgba(0, 82, 255, 0.5)',
            }
          }
        }
      }
    </script>
    <style>
      body {
        transition: background-color 0.3s ease, color 0.3s ease;
      }
      
      /* Dark mode inputs autofill fix */
      .dark input:-webkit-autofill,
      .dark input:-webkit-autofill:hover, 
      .dark input:-webkit-autofill:focus, 
      .dark input:-webkit-autofill:active{
          -webkit-box-shadow: 0 0 0 30px #111 inset !important;
          -webkit-text-fill-color: white !important;
      }

      /* Light mode inputs autofill fix */
      input:-webkit-autofill,
      input:-webkit-autofill:hover, 
      input:-webkit-autofill:focus, 
      input:-webkit-autofill:active{
          -webkit-box-shadow: 0 0 0 30px #F3F4F6 inset !important;
          -webkit-text-fill-color: black !important;
      }
      
      .glass {
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
      }
    </style>
  <script type="importmap">

}
</script>
